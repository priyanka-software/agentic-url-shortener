spring.application.name=agentic-url-shortener
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:mem:shortener;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
app.base-url=${BASE_URL:http://localhost:8080}

# Optional OpenAI-compatible runtime AI enhancement. Leave blank for deterministic evaluator-safe fallback.
agent.ai.base-url=${AGENT_AI_BASE_URL:}
agent.ai.api-key=${AGENT_AI_API_KEY:}
agent.ai.model=${AGENT_AI_MODEL:}
